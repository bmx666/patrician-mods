[workspace]
resolver = "2"
members = ["crates/core", "crates/winmm", "crates/launcher", "crates/qol", "crates/localization", "crates/nosmc", "crates/aim", "crates/asi", "crates/asi-mp3", "crates/asi-aac", "crates/cpr", "crates/cprtool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/bmx666/patrician-mods"

[workspace.dependencies]
pcore = { path = "crates/core" }
cpr = { path = "crates/cpr" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

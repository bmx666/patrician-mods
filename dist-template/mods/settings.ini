; Patrician mods settings (Patrician II and Patrician III). 1 = on, 0 = off.
; A missing key means on. Results of every start are written to mods\loader.log.

[loader]
; 0 = load no mods (winmm.dll then only forwards, the launcher starts the plain game)
enabled=1
; game executable for patrician-launcher.exe; empty = Patrician3.exe, else Patrician 2.exe
exe=

[qol]
; fixes of original bugs
music_fade=1
tutorial_ambience=1
single_game_title=1
shipyard_knots=1
campaign_speed=1
; display
ship_speed=1
building_backdrop=1
trade_route_dialog=1
; controls
wasd=1
speed_keys=1
speed_plate=1
; sound files: .mp3 / .aac picked by what exists on disk
stream_open=1

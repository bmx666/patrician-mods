; Patrician mods settings (Patrician II and Patrician III). 1 = on, 0 = off.
; A missing key means on. Results of every start are written to mods\loader.log.

[loader]
; 0 = load no mods (winmm.dll then only forwards, the launcher starts the plain game)
enabled=1
; game executable for patrician-launcher.exe; empty = Patrician3.exe, else Patrician 2.exe
exe=

[qol]
; fixes of original bugs
music_fade=1
tutorial_ambience=1
single_game_title=1
shipyard_knots=1
campaign_speed=1
; display
ship_speed=1
building_backdrop=1
trade_route_dialog=1
; controls
wasd=1
speed_keys=1
speed_plate=1
; sound files: .mp3 / .aac picked by what exists on disk
stream_open=1
; the third resolution of the options is [display] width x height
widescreen=1

[display]
; size of the third resolution (widescreen=1); 0 = 1280 x 1024.
; Width 1026..4096 (even), height 720..2400. Written when the options are saved.
width=0
height=0

[localization]
; language of mods\localization.dll: two-letter ISO 639-1 code (en, ru, de, sv, ...); missing = en.
; Files in mods\localization\<lang>\<p2|p3>\ replace the game files of the same name,
; e.g. mods\localization\ru\p3\scripts\buttons.ini (p2 = Patrician II, p3 = Patrician III).
; GOG executables: exe\*.tsv translate the texts built into the game; en leaves them as is.
; Written by the language selector of the main menu.
lang=en

[nosmc]
; image decoder AIM.dll without self-modifying code (fast drawing under Rosetta 2 / ARM64 x86 translators).
; auto = on when macOS, Rosetta 2 or an ARM64 host is detected (see mods\loader.log); 1 = always; 0 = never.
enabled=auto

[aim]
; optional\AIM.dll only (the replacement image decoder).
; scaling of pictures converted to another size: smooth = bilinear when enlarging, area averaging when reducing,
; alpha-weighted (palette pictures by nearest pixel); nearest = nearest pixel; original = as the game's AIM.dll.
filter=smooth
; pictures in mods\textures\ (.png, .jpg, .bmp, .tga) replace the game's of the same name and path, e.g.
; mods\textures\images\town.png replaces images\town.bmp; 0 = off.
textures=1
; size of a replacement: original = scaled to the game picture's size; native = its own size.
texture_size=original

; Patrician mods settings (Patrician II and Patrician III). 1 = on, 0 = off.
; A missing key means on. Results of every start are written to mods\loader.log.

[loader]
; 0 = load no mods (winmm.dll then only forwards, the launcher starts the plain game)
enabled=1
; game executable for patrician-launcher.exe; empty = Patrician3.exe, else Patrician 2.exe
exe=

[qol]
; fixes of original bugs
music_fade=1
tutorial_ambience=1
single_game_title=1
shipyard_knots=1
campaign_speed=1
; display
ship_speed=1
building_backdrop=1
trade_route_dialog=1
; controls
wasd=1
speed_keys=1
speed_plate=1
; sound files: .mp3 / .aac picked by what exists on disk
stream_open=1
; Patrician II: the third resolution of the options is [display] width x height
widescreen=1

[display]
; size of the third resolution (Patrician II, widescreen=1); 0 = 1280 x 1024.
; Width 1026..4096 (even), height 720..2400. Written when the options are saved.
width=0
height=0

[localization]
; language of mods\localization.dll: two-letter ISO 639-1 code (en, ru, de, sv, ...); missing = en.
; Files in mods\localization\<lang>\ replace the game files of the same name,
; e.g. mods\localization\ru\scripts\buttons.ini
lang=en
